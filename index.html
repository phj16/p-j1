<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>디지털 트윈 지진 시뮬레이션</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
}

h1{
    margin-top:20px;
}

.subtitle{
    color:#666;
    margin-bottom:20px;
}

.container{
    display:flex;
    justify-content:center;
    gap:80px;
    margin-top:40px;
}

.model{
    text-align:center;
}

.ground{
    width:120px;
    height:20px;
    background:#555;
    margin:auto;
    position:relative;
}

.building{
    width:80px;
    height:180px;
    background:#4a90e2;
    margin:auto;
    position:relative;
    transform-origin:bottom center;
    transition:transform 0.05s linear;
}

.label{
    margin-top:10px;
    font-weight:bold;
}

.controls{
    margin-top:30px;
}
</style>
</head>

<body>

<h1>🏢 Digital Twin Earthquake Simulator</h1>

<div class="subtitle">
동일한 지진이 발생했을 때 내진·제진·면진 구조 건물의 거동 비교
</div>

<div class="controls">

진도 :
<input type="range" id="intensity"
       min="1" max="10" value="5">

<span id="value">5</span>

<button onclick="startEarthquake()">
지진 발생
</button>

</div>

<div class="container">

<div class="model">
<div class="building" id="naejin"></div>
<div class="ground"></div>
<div class="label">내진 구조</div>
</div>

<div class="model">
<div class="building" id="jejin"></div>
<div class="ground"></div>
<div class="label">제진 구조</div>
</div>

<div class="model">
<div class="building" id="myeonjin"></div>
<div class="ground" id="base"></div>
<div class="label">면진 구조</div>
</div>

</div>

<script>

const slider =
document.getElementById("intensity");

slider.oninput = () => {
document.getElementById("value")
.innerText = slider.value;
};

function startEarthquake(){

const magnitude =
Number(slider.value);

const naejin =
document.getElementById("naejin");

const jejin =
document.getElementById("jejin");

const myeonjin =
document.getElementById("myeonjin");

const base =
document.getElementById("base");

let frame = 0;

const interval = setInterval(()=>{

frame++;

const wave =
Math.sin(frame*0.35);

const shake = magnitude;

naejin.style.transform =
`rotate(${wave*shake*1.5}deg)`;

jejin.style.transform =
`rotate(${wave*shake*0.8}deg)`;

myeonjin.style.transform =
`rotate(${wave*shake*0.2}deg)`;

base.style.transform =
`translateX(${wave*shake*3}px)`;

if(frame>120){

clearInterval(interval);

naejin.style.transform="rotate(0deg)";
jejin.style.transform="rotate(0deg)";
myeonjin.style.transform="rotate(0deg)";
base.style.transform="translateX(0px)";
}

},30);
}
</script>

</body>
</html>
